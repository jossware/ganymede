[package]
name = "ganymede"
version = "0.1.0"
edition = "2024"
description = "Archive agent sessions from Claude Code and Codex into an Obsidian vault"
repository = "https://github.com/ryane/ganymede"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
fs4 = "1"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[dev-dependencies]
insta = "1"
